# For controller node testing. Publish from terminal with:
# ros2 topic pub /path nav_msgs/msg/Path "$(cat /path/to/test_path_msg.yaml)"

header:
  stamp:
    sec: 0
    nanosec: 0
  frame_id: "Archimede_odom"

poses:
  - header:
      stamp:
        sec: 0
        nanosec: 0
      frame_id: "Archimede_odom"
    pose:
      position:
        x: 3
        y: 0.0
        z: 0.0
      orientation:
        x: 0.0
        y: 0.0
        z: 0.0
        w: 1.0

